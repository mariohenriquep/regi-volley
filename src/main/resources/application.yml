spring:
  application:
    name: regi-volley

  datasource:
    # logServerErrorDetail=false: PostgreSQL's constraint-violation detail quotes the offending row
    # ("Key (association_id, email)=(..., ana@example.com) already exists", "Failing row contains ..."),
    # which would put personal data in exception messages and logs (NFR RGPD). The constraint name stays
    # available, which is all the adapters need.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:regi_volley}?logServerErrorDetail=false
    username: ${DB_USER:regi_volley}
    password: ${DB_PASSWORD:regi_volley}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Instants are stored and read in UTC; conversion to Europe/Lisbon happens only at the
        # edge (NFR "time zone").
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Hardening (docs/security/threat-model-rest-api.md section 7): no file uploads, no request details in logs, and a body
  # with a field we do not know is a 400, never silently dropped (mass assignment, M3).
  servlet:
    multipart:
      enabled: false
  mvc:
    log-request-details: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

regi-volley:
  session-generation:
    # Daily generation of the coming weeks' sessions (US-10); idempotent. Tests switch it off.
    enabled: ${SESSION_GENERATION_ENABLED:true}
    cron: ${SESSION_GENERATION_CRON:0 0 3 * * *}

  join-request-purge:
    # Daily erasure (anonymisation) of join requests left undecided for 30 days: RGPD data minimisation. Tests switch it off.
    enabled: ${JOIN_REQUEST_PURGE_ENABLED:true}
    cron: ${JOIN_REQUEST_PURGE_CRON:0 30 3 * * *}

  mail:
    # Outbound email (issue #40, threat model G3). With SMTP_HOST unset the logging adapters stay active, which only profiles dev and test
    # allow: every other profile refuses to start unless host, credentials, MAIL_FROM, SMTP_SECURITY (STARTTLS or TLS) and an https
    # WEB_ORIGIN are set. Local development: Mailpit from docker-compose (SMTP_HOST=localhost SMTP_PORT=1025 SMTP_SECURITY=NONE).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    # STARTTLS (port 587, required not optional), TLS (implicit, port 465) or NONE (dev only; refused elsewhere).
    security: ${SMTP_SECURITY:STARTTLS}
    # The From header, optionally with a display name: RegiVolley <no-reply@example.org>
    from: ${MAIL_FROM:}

  security:
    jwt:
      # ES256 keys (threat model D-1, D-2), from the environment or the platform secret store, never from the repo.
      # JWT_SIGNING_KEY: the active private key (JWK JSON, or PKCS#8 PEM preceded by a `kid: <id>` line).
      # JWT_VERIFICATION_KEYS: the public keys, JWK Set JSON or X.509 PEM blocks each preceded by `kid: <id>`; always
      # includes the active key's public half. Profile dev/test with nothing set: an ephemeral key pair is generated.
      signing-key: ${JWT_SIGNING_KEY:}
      verification-keys: ${JWT_VERIFICATION_KEYS:}
    # The web origin (scheme://host[:port], no path) that may call the two cookie endpoints (/auth/refresh, /auth/logout) besides
    # the API's own origin (threat model D-7a). Set it when TLS ends at a proxy and the app sees plain http, e.g. https://app.example.org.
    # It is also the origin of the links in the emails (/activate#token=..., /reset-password#token=...), so outside dev / test it is required (https).
    web-origin: ${WEB_ORIGIN:}
    cors:
      # Honoured under profile `dev` only (production is same-origin): the one local PWA origin, e.g. http://localhost:5173.
      allowed-origin: ${CORS_ALLOWED_ORIGIN:}

server:
  port: ${SERVER_PORT:8080}
  # Where the client address for rate limiting comes from (threat model D-9). `none`: the connection's own address, and
  # X-Forwarded-For is ignored - the only safe choice while nothing trusted sits in front, because otherwise any client could
  # pick a fresh rate-limit bucket by lying. Behind a known reverse proxy set FORWARD_HEADERS_STRATEGY=native AND
  # server.tomcat.remoteip.internal-proxies to that proxy's address (Tomcat's default trusts every private range).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Nothing about an error leaves in a body (threat model E1); ErrorPageController writes the generic one.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: never
  max-http-request-header-size: 8KB
  tomcat:
    # What Tomcat reads and discards after a request was refused early (413, 411, 401), before it closes the connection.
    max-swallow-size: 128KB

logging:
  pattern:
    # The request id on every line, so a log line can be tied to the response a client saw.
    level: "%5p [%X{requestId:-}]"
  level:
    com.regivolley.api: INFO
    # Spring's own handler logs the exception message, which for a rejected body or parameter quotes the input (E2).
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
