spring:
  application:
    name: regi-volley

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:regi_volley}
    username: ${DB_USER:regi_volley}
    password: ${DB_PASSWORD:regi_volley}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Instants are stored and read in UTC; conversion to Europe/Lisbon happens only at the
        # edge (NFR "Fuso horário").
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.regivolley.api: INFO
